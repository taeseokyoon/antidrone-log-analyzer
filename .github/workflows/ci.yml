name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Unit / end-to-end tests
        run: pytest -q
      - name: Analyze bundled sample data
        run: python -m antidrone_analyzer analyze --data samples --out reports/ci
      - name: Large-file benchmark (100 MB, reproducibility check)
        run: python tools/benchmark.py --copies 50
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report-py${{ matrix.python-version }}
          path: reports/ci
